name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install ".[dev,providers]"
      - name: Run tests
        run: python -m pytest -q

  optional-features:
    name: Optional API, UI, stores, and provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tested extras
        run: >-
          python -m pip install
          ".[dev,server,ui,qdrant,mongo,faiss,providers]"
      - name: Run full suite with optional dependencies
        run: python -m pytest -q

  postgres:
    name: PostgreSQL Studio backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epilens_test
        ports:
          - 5432:5432
        # Wait until the server accepts connections before the steps start.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the PostgreSQL half of the Studio repository contract tests,
      # which are skipped everywhere else.
      EPILENS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epilens_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with the PostgreSQL extra
        run: python -m pip install ".[dev,postgres]"
      - name: Run the repository contract on SQLite and PostgreSQL
        run: python -m pytest tests/integration/studio -q -rs

  quality:
    name: Lint and package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src/epilens tests
      - name: Remove stale build artifacts
        run: python scripts/clean_release_artifacts.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check artifact metadata
        run: python -m twine check dist/*
      - name: Verify the wheel outside the source tree
        shell: bash
        run: |
          wheel="$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')"
          wheel="$(cd "$(dirname "$wheel")" && pwd)/$(basename "$wheel")"
          python -m venv /tmp/epilens-wheel-smoke
          /tmp/epilens-wheel-smoke/bin/python -m pip install "$wheel"
          cd /tmp
          /tmp/epilens-wheel-smoke/bin/python -c "import epilens; print(epilens.__version__)"
          /tmp/epilens-wheel-smoke/bin/epilens --help
          /tmp/epilens-wheel-smoke/bin/python -m epilens --version
